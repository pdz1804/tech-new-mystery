name: App CI/CD

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "agent_core/**"
      - "infra/docker/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "agent_core/**"
      - "infra/docker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  TF_VERSION: 1.6.1
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'tech-news-mystery-tfstate-381492273521' }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'terraform.tfstate' }}
  TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE || 'tech-news-mystery-terraform-locks' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'tech-news-mystery-prod' }}
  BACKEND_ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY || 'tech-news-mystery-prod-backend' }}
  FRONTEND_ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY || 'tech-news-mystery-prod-frontend' }}
  AGENT_CORE_ECR_REPOSITORY: ${{ vars.AGENT_CORE_ECR_REPOSITORY || 'tech-news-mystery-prod-agent-core' }}
  AGENT_CORE_CODEBUILD_PROJECT: ${{ vars.AGENT_CORE_CODEBUILD_PROJECT || 'tech-news-mystery-prod-agent-core-arm64-image' }}
  AGENT_CORE_CODEBUILD_SOURCE_BUCKET: ${{ vars.AGENT_CORE_CODEBUILD_SOURCE_BUCKET || 'tech-news-mystery-prod-codebuild-sources-381492273521' }}
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || '/v1' }}
  APP_SECRET_NAME: ${{ vars.APP_SECRET_NAME || 'tech-news-mystery-prod/app' }}

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall app

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run type-check

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  agent-core-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent-core dependencies
        run: pip install -r agent_core/requirements.txt

      - name: Compile agent-core
        run: python -m compileall agent_core

      - name: Run agent-core unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest agent_core/tests/ -v --tb=short

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - backend-checks
      - frontend-checks
      - agent-core-checks
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-state-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image (for api, worker, beat services)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f infra/docker/backend.Dockerfile -t "$ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG" backend
          docker tag "$ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:latest"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" -f frontend/Dockerfile -t "$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:$IMAGE_TAG" frontend
          docker tag "$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:latest"

      - name: Build and push agent-core image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          print_build_failure() {
            local build_id="$1"
            echo "::error::AgentCore CodeBuild failed: $build_id"
            aws codebuild batch-get-builds \
              --ids "$build_id" \
              --query 'builds[0].phases[].{phase:phaseType,status:phaseStatus,contexts:contexts}' \
              --output json

            LOG_GROUP=$(aws codebuild batch-get-builds \
              --ids "$build_id" \
              --query 'builds[0].logs.groupName' \
              --output text)
            LOG_STREAM=$(aws codebuild batch-get-builds \
              --ids "$build_id" \
              --query 'builds[0].logs.streamName' \
              --output text)

            if [ "$LOG_GROUP" != "None" ] && [ "$LOG_STREAM" != "None" ]; then
              aws logs get-log-events \
                --log-group-name "$LOG_GROUP" \
                --log-stream-name "$LOG_STREAM" \
                --limit 120 \
                --query 'events[].message' \
                --output text
            fi
          }

          git archive --format=zip --output source.zip HEAD
          aws s3 cp source.zip "s3://$AGENT_CORE_CODEBUILD_SOURCE_BUCKET/agent-core/source.zip"

          BUILD_ID=$(aws codebuild start-build \
            --project-name "$AGENT_CORE_CODEBUILD_PROJECT" \
            --environment-variables-override name=IMAGE_TAG,value="$IMAGE_TAG",type=PLAINTEXT \
            --query 'build.id' \
            --output text)

          while true; do
            STATUS=$(aws codebuild batch-get-builds \
              --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' \
              --output text)

            case "$STATUS" in
              SUCCEEDED) break ;;
              FAILED|FAULT|STOPPED|TIMED_OUT) print_build_failure "$BUILD_ID"; exit 1 ;;
              *) sleep 15 ;;
            esac
          done

      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE" \
            -backend-config="encrypt=true"

      - name: Import Existing Production Resources
        working-directory: infra/terraform
        env:
          REGION: ${{ env.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET_NAME || 'tech-news-articles-381492273521' }}
          TABLE_PREFIX: ${{ vars.DYNAMODB_TABLE_PREFIX || 'tech-news-' }}
          NAME_PREFIX: ${{ vars.TF_NAME_PREFIX || 'tech-news-mystery-prod' }}
          CODEBUILD_SOURCE_BUCKET: ${{ env.AGENT_CORE_CODEBUILD_SOURCE_BUCKET }}
        run: bash scripts/import-existing.sh

      - name: Sync production app secret
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          secret_id = os.environ["APP_SECRET_NAME"]
          region = os.environ["AWS_REGION"]
          keys = [
              "SECRET_KEY",
              "JWT_SECRET_KEY",
              "OPENAI_API_KEY",
              "TAVILY_API_KEY",
              "NEWSAPI_KEY",
              "QDRANT_URL",
              "QDRANT_API_KEY",
              "GEMINI_API_KEY",
              "ANTHROPIC_API_KEY",
              "LANGFUSE_SECRET_KEY",
              "LANGFUSE_PUBLIC_KEY",
              "LANGFUSE_BASE_URL",
              "LANGSMITH_API_KEY",
              "ELEVENLABS_API_KEY",
              "ELEVENLABS_VOICE_ID",
              "LIVEKIT_API_KEY",
              "LIVEKIT_API_SECRET",
          ]
          required = [
              "SECRET_KEY",
              "JWT_SECRET_KEY",
              "OPENAI_API_KEY",
              "QDRANT_URL",
              "QDRANT_API_KEY",
              "LANGSMITH_API_KEY",
              "ELEVENLABS_API_KEY",
              "ELEVENLABS_VOICE_ID",
              "LIVEKIT_API_KEY",
              "LIVEKIT_API_SECRET",
          ]

          current = "{}"
          try:
              current = subprocess.check_output(
                  [
                      "aws",
                      "secretsmanager",
                      "get-secret-value",
                      "--region",
                      region,
                      "--secret-id",
                      secret_id,
                      "--query",
                      "SecretString",
                      "--output",
                      "text",
                  ],
                  text=True,
              )
          except subprocess.CalledProcessError as exc:
              print(f"::error::Unable to read app secret {secret_id}: {exc}", file=sys.stderr)
              raise

          payload = json.loads(current or "{}")
          if not isinstance(payload, dict):
              print("::error::App secret must be a JSON object.", file=sys.stderr)
              sys.exit(1)

          updated = []
          for key in keys:
              value = os.environ.get(key, "")
              if value:
                  payload[key] = value
                  updated.append(key)

          missing = [key for key in required if not payload.get(key)]
          if missing:
              print(
                  "::error::App secret is missing required JSON keys: "
                  + ", ".join(missing)
                  + ". Add them as GitHub Actions secrets or update Secrets Manager before deploy.",
                  file=sys.stderr,
              )
              sys.exit(1)

          subprocess.check_call(
              [
                  "aws",
                  "secretsmanager",
                  "put-secret-value",
                  "--region",
                  region,
                  "--secret-id",
                  secret_id,
                  "--secret-string",
                  json.dumps(payload, separators=(",", ":")),
              ]
          )
          print("Synced app secret keys: " + ", ".join(updated or ["no GitHub secret overrides"]))
          PY

      - name: Deploy image tags with Terraform
        working-directory: infra/terraform
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          terraform apply \
            -lock-timeout=5m \
            -auto-approve \
            -var="backend_image_tag=$IMAGE_TAG" \
            -var="frontend_image_tag=$IMAGE_TAG" \
            -var="agent_core_image_tag=$IMAGE_TAG"

      - name: Wait for ECS services
        run: |
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services api frontend worker beat clustering
